<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 110" width="100%" height="100%">
  <defs>
    <!-- Gradiente Neon Principal -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Padrão Hexagonal de Fundo -->
    <pattern id="hexGrid" width="28" height="48.497" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 28 8.082 L 28 24.249 L 14 32.331 L 0 24.249 L 0 8.082 Z M 14 48.497 L 28 40.415 L 28 24.249 L 14 32.331 L 0 24.249 L 0 40.415 Z" fill="none" stroke="#8A2BE2" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Fundo e Grelha -->
  <rect x="5" y="5" width="940" height="100" rx="12" fill="#090014" stroke="url(#purpleGlow)" stroke-width="2" />
  <rect x="10" y="10" width="930" height="90" rx="8" fill="url(#hexGrid)" />

  <!-- Moldura e Cantos Táticos HUD -->
  <path d="M 15 25 L 25 15 L 925 15 L 935 25 L 935 85 L 925 95 L 25 95 L 15 85 Z" fill="none" stroke="#8A2BE2" stroke-width="1" stroke-opacity="0.3" />
  <path d="M 12 30 L 12 18 L 24 18" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 938 30 L 938 18 L 926 18" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 12 80 L 12 92 L 24 92" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 938 80 L 938 92 L 926 92" fill="none" stroke="#00F0FF" stroke-width="2" />

  <!-- CABEÇALHO SIMPLIFICADO E ALINHADO -->
  <g transform="translate(35, 42)">
    <!-- Número e Título -->
    <text x="0" y="0" font-family="monospace" font-weight="900" fill="#D946EF" font-size="24">04</text>
    <text x="40" y="0" font-family="monospace" font-weight="900" fill="#C026D3" font-size="24">//</text>
    <text x="75" y="-1" font-family="sans-serif" font-weight="800" fill="#FFFFFF" font-size="20">GITHUB STATUS</text>
    
    <!-- Subtítulo -->
    <text x="0" y="22" font-family="monospace" font-size="10" fill="#00F0FF" opacity="0.8">> METRICAS E ESTATISTICAS EM TEMPO REAL</text>
  </g>

  <!-- PÍLULA DE STATUS (DIREITA) -->
  <g transform="translate(735, 30)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#090014" stroke="#8A2BE2" stroke-width="1.5" />
    <text x="18" y="17" font-family="monospace" font-size="10" fill="#00F0FF" font-weight="600">SYSTEM ONLINE</text>
    <circle cx="148" cy="13" r="3" fill="#00F0FF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 630" width="100%" height="100%">
  <defs>
    <!-- Gradientes Neon -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120626" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090014" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.4" />
    </linearGradient>

    <!-- Pattern Hexagonal de Fundo -->
    <pattern id="hexGrid" width="28" height="48.497" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 28 8.082 L 28 24.249 L 14 32.331 L 0 24.249 L 0 8.082 Z M 14 48.497 L 28 40.415 L 28 24.249 L 14 32.331 L 0 24.249 L 0 40.415 Z" fill="none" stroke="#8A2BE2" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Fundo Principal com Borda Neon -->
  <rect x="5" y="5" width="940" height="620" rx="16" fill="#090014" stroke="url(#purpleGlow)" stroke-width="2.5" />
  
  <!-- Overlay de Grelha Cyberpunk -->
  <rect x="15" y="15" width="920" height="600" rx="10" fill="url(#hexGrid)" />

  <!-- Moldura HUD Tática -->
  <path d="M 25 45 L 45 25 L 905 25 L 925 45 L 925 585 L 905 605 L 45 605 L 25 585 Z" fill="none" stroke="#8A2BE2" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Detalhes HUD nos Cantos -->
  <path d="M 20 50 L 20 30 L 40 30" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 930 50 L 930 30 L 910 30" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 20 580 L 20 600 L 40 600" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 930 580 L 930 600 L 910 600" fill="none" stroke="#00F0FF" stroke-width="2" />

  <!-- CABEÇALHO DA SEÇÃO -->
  <g transform="translate(45, 65)">

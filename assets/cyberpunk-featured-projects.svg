      <text x="0" y="40" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="11" fill="#A78BFA">identidade visual moderna, alta performance</text>
      <text x="0" y="60" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="11" fill="#A78BFA">e navegação responsiva e intuitiva.</text>

<svg id="cyberpunk-projects-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background-color: #090014; font-family: 'Fira Code', monospace, sans-serif;">
        <defs>
          <!-- Glow Filters -->
          <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Gradients -->
          <linearGradient id="card-bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#120224" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#090014" stop-opacity="0.95"/>
          </linearGradient>

          <linearGradient id="teaser-bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1a0430" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#090014" stop-opacity="0.9"/>
          </linearGradient>
        </defs>

        <!-- Master Frame -->
        <rect x="10" y="10" width="930" height="460" rx="16" fill="#090014" stroke="#8A2BE2" stroke-width="2" filter="url(#glow-purple)"/>

        <!-- Top Accent Trim Lines -->
        <path d="M 20 45 L 45 20 L 160 20" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow-cyan)"/>
        <path d="M 930 435 L 905 460 L 780 460" fill="none" stroke="#C026D3" stroke-width="2.5" filter="url(#glow-purple)"/>

        <!-- Vertical Side Japanese Graphic Art Text -->
        <text x="32" y="140" fill="#A855F7" font-size="13" font-weight="bold" writing-mode="tb" glyph-orientation-vertical="0" opacity="0.75">プロジェクト</text>

        <!-- TOP HEADER SECTION -->
        <g transform="translate(60, 30)">
          <!-- Main Section Title -->
          <text x="10" y="38" fill="#E879F9" font-size="30" font-weight="900" letter-spacing="2" filter="url(#glow-purple)">03 // FEATURED PROJECTS</text>

          <!-- System Status Badge -->
          <g transform="translate(420, 10)">
            <rect x="0" y="0" width="220" height="32" rx="16" fill="#120224" stroke="#8A2BE2" stroke-width="1.5"/>
            <text x="18" y="21" fill="#00F0FF" font-size="12" font-weight="bold">&gt;_ REPOSITORIES ONLINE</text>
            <circle cx="196" cy="16" r="4.5" fill="#00F0FF" filter="url(#glow-cyan)"/>
          </g>

          <!-- Top Right Cyber Code Stats -->
          <g transform="translate(710, 8)">
            <text x="0" y="12" fill="#A855F7" font-size="10" font-weight="bold" letter-spacing="1">HUB // 2077</text>
            <text x="0" y="24" fill="#A855F7" font-size="10" font-weight="bold" letter-spacing="1">STATUS: ACTIVE</text>
            <text x="0" y="36" fill="#A855F7" font-size="10" font-weight="bold" letter-spacing="1">BRANCH: MAIN</text>
          </g>
        </g>

        <!-- Subtitle Divider -->
        <text x="70" y="112" fill="#C084FC" font-size="13" font-weight="700" letter-spacing="1.5">&gt; REPOSITÓRIOS EM DESTAQUE E EM DESENVOLVIMENTO</text>
        <line x1="70" y1="122" x2="880" y2="122" stroke="#8A2BE2" stroke-width="1" opacity="0.35"/>

        <!-- ================= PROJECT CARD 01 (LEFT: CATÁLOGO STREETWEAR) ================= -->
        <g transform="translate(70, 140)">
          <!-- Card Outline Cut Shape -->
          <path d="M 0 16 L 16 0 L 374 0 L 390 16 L 390 264 L 374 280 L 16 280 L 0 264 Z" fill="url(#card-bg-gradient)" stroke="#8A2BE2" stroke-width="1.5"/>

          <!-- Top Pill Tag -->
          <g transform="translate(20, 20)">
            <rect x="0" y="0" width="130" height="22" rx="6" fill="#C026D3" opacity="0.25"/>
            <rect x="0" y="0" width="130" height="22" rx="6" fill="none" stroke="#C026D3" stroke-width="1"/>
            <text x="12" y="15" fill="#E879F9" font-size="10" font-weight="bold" letter-spacing="1">FEATURED // 01</text>
          </g>

          <!-- Live Status Tag -->
          <g transform="translate(260, 20)">
            <circle cx="8" cy="11" r="4" fill="#00F0FF" filter="url(#glow-cyan)"/>
            <text x="18" y="15" fill="#00F0FF" font-size="11" font-weight="bold">DEPLOYED</text>
          </g>

          <!-- Project Title -->
          <text x="20" y="72" fill="#FFFFFF" font-size="18" font-weight="900" letter-spacing="1">CATÁLOGO STREETWEAR</text>

          <!-- Project Description -->
          <text x="20" y="100" fill="#CBD5E1" font-size="11" width="350">
            <tspan x="20" dy="0">Catálogo digital para apresentação de tênis com</tspan>
            <tspan x="20" dy="16">uma identidade visual urbana e moderna.</tspan>
            <tspan x="20" dy="16">Foco em experiência de navegação e organização.</tspan>
          </text>

          <!-- Tech Badges -->
          <g transform="translate(20, 160)">
            <!-- HTML Badge -->
            <rect x="0" y="0" width="60" height="22" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
            <text x="30" y="15" fill="#A5B4FC" font-size="10" font-weight="bold" text-anchor="middle">HTML5</text>

            <!-- CSS Badge -->
            <rect x="68" y="0" width="55" height="22" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
            <text x="95" y="15" fill="#A5B4FC" font-size="10" font-weight="bold" text-anchor="middle">CSS3</text>

            <!-- JS Badge -->
            <rect x="131" y="0" width="90" height="22" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
            <text x="176" y="15" fill="#A5B4FC" font-size="10" font-weight="bold" text-anchor="middle">JAVASCRIPT</text>
          </g>

          <!-- Action Button Visual Indicator -->
          <g transform="translate(20, 215)">
            <rect x="0" y="0" width="350" height="42" rx="8" fill="#120224" stroke="#00F0FF" stroke-width="1.2" filter="url(#glow-cyan)" opacity="0.9"/>
            <text x="175" y="26" fill="#00F0FF" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">[ VIEW REPOSITORY ] ➔</text>
          </g>
        </g>

        <!-- ================= PROJECT CARD 02 (RIGHT: GAME DEV / TEASER) ================= -->
        <g transform="translate(490, 140)">
          <!-- Card Outline Cut Shape -->
          <path d="M 0 16 L 16 0 L 374 0 L 390 16 L 390 264 L 374 280 L 16 280 L 0 264 Z" fill="url(#teaser-bg-gradient)" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="6,3"/>

          <!-- Top Pill Tag -->
          <g transform="translate(20, 20)">
            <rect x="0" y="0" width="160" height="22" rx="6" fill="#8A2BE2" opacity="0.3"/>
            <rect x="0" y="0" width="160" height="22" rx="6" fill="none" stroke="#8A2BE2" stroke-width="1"/>
            <text x="12" y="15" fill="#C084FC" font-size="10" font-weight="bold" letter-spacing="1">IN DEVELOPMENT // 02</text>
          </g>

          <!-- Live Status Tag -->
          <g transform="translate(250, 20)">
            <circle cx="8" cy="11" r="4" fill="#E879F9" filter="url(#glow-purple)"/>
            <text x="18" y="15" fill="#E879F9" font-size="11" font-weight="bold">INITIALIZING...</text>
          </g>

          <!-- Project Title -->
          <text x="20" y="72" fill="#E2E8F0" font-size="18" font-weight="900" letter-spacing="1">GAME DEV / NEXT PROJECT</text>

          <!-- Project Description -->
          <text x="20" y="100" fill="#94A3B8" font-size="11">
            <tspan x="20" dy="0">Desenvolvimento de jogos e arquitetura de novos</tspan>
            <tspan x="20" dy="16">sistemas. Projeto tático em fase de modelagem e</tspan>
            <tspan x="20" dy="16">configuração de mecânicas principais.</tspan>
          </text>

          <!-- Tech Badges Teaser -->
          <g transform="translate(20, 160)">
            <rect x="0" y="0" width="85" height="22" rx="4" fill="#2e103f" stroke="#8A2BE2" stroke-width="1"/>
            <text x="42" y="15" fill="#E879F9" font-size="10" font-weight="bold" text-anchor="middle">GAME DEV</text>

            <rect x="93" y="0" width="80" height="22" rx="4" fill="#2e103f" stroke="#8A2BE2" stroke-width="1"/>
            <text x="133" y="15" fill="#E879F9" font-size="10" font-weight="bold" text-anchor="middle">CONCEPT</text>

            <rect x="181" y="0" width="75" height="22" rx="4" fill="#2e103f" stroke="#8A2BE2" stroke-width="1"/>
            <text x="218" y="15" fill="#E879F9" font-size="10" font-weight="bold" text-anchor="middle">SYSTEM</text>
          </g>

          <!-- Teaser Action Indicator -->
          <g transform="translate(20, 215)">
            <rect x="0" y="0" width="350" height="42" rx="8" fill="#120224" stroke="#8A2BE2" stroke-width="1" stroke-dasharray="4,4"/>
            <text x="175" y="26" fill="#C084FC" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">[ SYSTEM INITIALIZING ]</text>
          </g>
        </g>

        <!-- FOOTER SECTION -->
        <g transform="translate(60, 440)">
          <line x1="10" y1="0" x2="820" y2="0" stroke="#8A2BE2" stroke-width="1" opacity="0.3"/>
          <text x="10" y="15" fill="#A855F7" font-size="10" font-weight="bold" letter-spacing="1">LEO.MOSCHETTO // FEATURED PROJECTS MODULE</text>
          <text x="680" y="15" fill="#00F0FF" font-size="10" font-weight="bold" letter-spacing="1">UPDATED // 2026</text>
        </g>
      </svg>

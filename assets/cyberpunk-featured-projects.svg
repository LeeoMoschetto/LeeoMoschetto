  <!-- DECORAÇÕES LATERAIS -->
  <text x="15" y="220" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8A2BE2" opacity="0.5" transform="rotate(-90 15 220)" letter-spacing="3">LEO.MOSCHETTO // PROJECTS</text>
  <text x="935" y="220" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8A2BE2" opacity="0.5" transform="rotate(90 935 220)" letter-spacing="3">NIGHT CITY 2077 // HUD</text>

  <!-- RODAPÉ -->
  <g transform="translate(45, 592)">
    <circle cx="0" cy="-4" r="3" fill="#00F0FF" />
    <text x="12" y="0" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="10" fill="#7C3AED" letter-spacing="1.5">SEC_03 // REPOSITORIES_GRID_ACTIVE</text>
    <text x="730" y="0" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="10" fill="#7C3AED" letter-spacing="1.5">STATUS: ONLINE</text>
  </g>

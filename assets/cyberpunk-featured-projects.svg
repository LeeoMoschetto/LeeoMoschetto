      <rect x="0" y="0" width="36" height="36" rx="8" fill="#C026D3" fill-opacity="0.15" stroke="#C026D3" stroke-width="1" />
      <path d="M 10 18 L 26 18 M 18 10 L 18 26" fill="none" stroke="#D946EF" stroke-width="2" stroke-linecap="round" />
      <circle cx="24" cy="14" r="1.5" fill="#00F0FF" />
      <circle cx="22" cy="22" r="1.5" fill="#00F0FF" />
      <text x="50" y="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#E9D5FF" font-size="18" letter-spacing="1">Game Dev / Cyber App</text>
    </g>


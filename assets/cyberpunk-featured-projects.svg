    <text x="0" y="0" font-family="&#39;Courier New&#39;, Consolas, monospace" font-weight="900" fill="#D946EF" font-size="32" letter-spacing="2">03</text>
    <text x="55" y="0" font-family="&#39;Courier New&#39;, Consolas, monospace" font-weight="900" fill="#C026D3" font-size="32">//</text>
    <text x="100" y="-2" font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#FFFFFF" font-size="26" letter-spacing="2">FEATURED PROJECTS</text>
    
    <!-- Pílula de Status -->

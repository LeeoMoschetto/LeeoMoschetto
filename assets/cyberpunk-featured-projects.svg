      <text x="0" y="25" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="11" fill="#A78BFA">Desenvolvimento focado em mecânicas de jogo,</text>
      <text x="0" y="45" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="11" fill="#A78BFA">arquitetura de microsserviços ou aplicação</text>
      <text x="0" y="65" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="11" fill="#A78BFA">web interativa com temática futurista.</text>
    </g>


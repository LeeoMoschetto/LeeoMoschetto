      <text x="12" y="16" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="10" fill="#C084FC" font-weight="600">GAME DEV</text>
      
      <rect x="95" y="0" width="60" height="24" rx="4" fill="#8A2BE2" fill-opacity="0.15" stroke="#8A2BE2" stroke-width="1" />
      <text x="108" y="16" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="10" fill="#A78BFA" font-weight="600">PHP</text>

      <rect x="165" y="0" width="105" height="24" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1" />
      <text x="175" y="16" font-family="&#39;Courier New&#39;, Consolas, monospace" font-size="10" fill="#00F0FF" font-weight="600">MICROSERVICES</text>
    </g>

    <!-- Botão / Card Placeholder -->
    <g transform="translate(20, 335)">
      <rect x="0" y="0" width="375" height="50" rx="8" fill="#120626" stroke="#8A2BE2" stroke-width="1" stroke-dasharray="4,4" />
      <text x="80" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A2BE2" font-weight="700" letter-spacing="1">[ SYSTEM INITIALIZING... ]</text>

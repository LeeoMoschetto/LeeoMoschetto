<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Cyberpunk About Me Panel</title>
<desc id="desc">Painel futurista preto e roxo neon para a seção Sobre Mim.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080510"/><stop offset=".55" stop-color="#10091e"/><stop offset="1" stop-color="#05040b"/></linearGradient>
<linearGradient id="neon"><stop stop-color="#7e22ce"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#a855f7" stroke-opacity=".12"/></pattern>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><path d="M22 18H950L978 46V284L952 312H22L10 300V38Z"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1000" height="330" fill="url(#bg)"/><rect width="1000" height="330" fill="url(#grid)"/>

<text x="56" y="224" fill="#f3e8ff" font-family="Arial,sans-serif" font-size="16">Transformando ideias em soluções reais.</text>
<text x="56" y="251" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="14">Web development / PHP / SQL / Microservices</text>
<text x="56" y="275" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="14">Software Engineering / Game Development</text>
